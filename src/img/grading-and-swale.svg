<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="800" height="460" role="img" aria-label="Ground sloping away from a house, dropping at least 6 inches in the first 10 feet, with a shallow grassy swale carrying water away"><title>Ground sloping away from a house, dropping at least 6 inches in the first 10 feet, with a shallow grassy swale carrying water away</title><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#2b7fd0"/></marker><marker id="k" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L10,5L0,10z" fill="#1d2329"/></marker></defs><rect width="800" height="460" fill="#eef5fb"/><path d="M0,250 L250,250 L500,300 L560,330 L600,340 L640,330 L800,330 L800,460 L0,460 Z" fill="#b5553a"/><path d="M0,250 L250,250 L500,300 L560,330 L600,340 L640,330 L800,330" fill="none" stroke="#5e9a3a" stroke-width="10"/><rect x="40" y="110" width="210" height="140" fill="#e7e1d6" stroke="#1d2329" stroke-width="2"/><path d="M25,112 L145,40 L265,112 Z" fill="#8b8f94"/><text x="145" y="190" font-family="-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="24" font-weight="600" fill="#1d2329" text-anchor="middle">House</text><line x1="270" y1="232" x2="480" y2="282" stroke="#2b7fd0" stroke-width="5" marker-end="url(#a)"/><line x1="500" y1="290" x2="585" y2="322" stroke="#2b7fd0" stroke-width="5" marker-end="url(#a)"/><line x1="620" y1="330" x2="770" y2="318" stroke="#2b7fd0" stroke-width="4" marker-end="url(#a)"/><line x1="250" y1="250" x2="500" y2="250" stroke="#1d2329" stroke-width="2" stroke-dasharray="6 6"/><line x1="500" y1="252" x2="500" y2="298" stroke="#1d2329" stroke-width="2" marker-end="url(#k)" marker-start="url(#k)"/><text x="512" y="240" font-family="-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="22" font-weight="600" fill="#1d2329" text-anchor="start">At least 6 in drop</text><text x="375" y="395" font-family="-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="22" font-weight="600" fill="#1d2329" text-anchor="middle">in the first 10 ft</text><line x1="250" y1="370" x2="500" y2="370" stroke="#1d2329" stroke-width="2" marker-end="url(#k)" marker-start="url(#k)"/><line x1="640" y1="410" x2="600" y2="345" stroke="#1d2329" stroke-width="2"/><circle cx="600" cy="345" r="4" fill="#1d2329"/><text x="600" y="440" font-family="-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="22" font-weight="600" fill="#1d2329" text-anchor="middle">Swale steers water away</text><text x="780" y="50" font-family="-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="30" font-weight="700" fill="#1d2329" text-anchor="end">Regrading and a swale</text><text x="780" y="82" font-family="-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="20" font-weight="400" fill="#1d2329" text-anchor="end">Shape the ground so water runs away from the house</text></svg>